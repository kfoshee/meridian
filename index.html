<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#07110f" />
    <meta
      name="description"
      content="Meridian is building the software and operating layer for flexible electricity demand."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://meridian.kianfoshee.com/" />
    <meta property="og:title" content="Meridian" />
    <meta
      property="og:description"
      content="Unlocking capacity on the electric grid."
    />
    <meta property="og:image" content="https://meridian.kianfoshee.com/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Meridian" />
    <meta
      name="twitter:description"
      content="Unlocking capacity on the electric grid."
    />
    <meta name="twitter:image" content="https://meridian.kianfoshee.com/og.png" />
    <title>Meridian — Unlocking grid capacity</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #f2f3e9;
        --muted: #9aa9a2;
        --line: rgba(181, 224, 207, 0.16);
        --accent: #b9f7d8;
        --page: #07110f;
      }

      * {
        box-sizing: border-box;
      }

      html {
        min-height: 100%;
        background: var(--page);
      }

      body {
        min-height: 100vh;
        margin: 0;
        color: var(--ink);
        background:
          radial-gradient(circle at 78% 18%, rgba(71, 156, 123, 0.14), transparent 33rem),
          linear-gradient(rgba(181, 224, 207, 0.035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(181, 224, 207, 0.035) 1px, transparent 1px),
          var(--page);
        background-size: auto, 4rem 4rem, 4rem 4rem, auto;
        font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .shell {
        width: min(100% - 3rem, 82rem);
        min-height: 100vh;
        margin: 0 auto;
        display: grid;
        grid-template-rows: auto 1fr auto;
      }

      header,
      footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      header {
        min-height: 6.5rem;
        border-bottom: 1px solid var(--line);
      }

      .wordmark {
        color: var(--ink);
        font-size: 0.9rem;
        font-weight: 650;
        letter-spacing: 0.26em;
        text-decoration: none;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 0.65rem;
        color: var(--muted);
        font-size: 0.78rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .status::before {
        width: 0.45rem;
        height: 0.45rem;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 1rem rgba(185, 247, 216, 0.6);
        content: "";
      }

      main {
        align-self: center;
        padding: 7rem 0;
      }

      .eyebrow {
        margin: 0 0 1.8rem;
        color: var(--accent);
        font-size: 0.78rem;
        font-weight: 650;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      h1 {
        max-width: 10ch;
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(4rem, 9vw, 8.8rem);
        font-weight: 400;
        letter-spacing: -0.055em;
        line-height: 0.89;
      }

      .lede {
        max-width: 43rem;
        margin: 2.7rem 0 0;
        color: var(--muted);
        font-size: clamp(1.05rem, 2vw, 1.3rem);
        line-height: 1.65;
      }

      .lede strong {
        color: var(--ink);
        font-weight: 500;
      }

      footer {
        min-height: 5.5rem;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 0.76rem;
        letter-spacing: 0.04em;
      }

      footer a {
        color: inherit;
        text-decoration: none;
        transition: color 160ms ease;
      }

      footer a:hover,
      footer a:focus-visible {
        color: var(--ink);
      }

      @media (max-width: 640px) {
        .shell {
          width: min(100% - 2rem, 82rem);
        }

        header {
          min-height: 5rem;
        }

        main {
          padding: 5rem 0;
        }

        .status {
          font-size: 0.66rem;
        }

        footer {
          align-items: flex-start;
          flex-direction: column;
          justify-content: center;
          gap: 0.35rem;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header>
        <a class="wordmark" href="/" aria-label="Meridian home">MERIDIAN</a>
        <span class="status">Building now</span>
      </header>

      <main>
        <p class="eyebrow">Grid infrastructure</p>
        <h1>Unlocking grid capacity.</h1>
        <p class="lede">
          Meridian is building the software and operating layer that helps large,
          flexible electricity loads connect faster—<strong>turning time-varying
          grid headroom into usable capacity.</strong>
        </p>
      </main>

      <footer>
        <span>Meridian</span>
        <a href="https://kianfoshee.com" rel="author">Built by Kian Foshee</a>
      </footer>
    </div>
  </body>
</html>
